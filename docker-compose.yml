name: pulsecheck

x-app-image: &app-image
  image: ${APP_IMAGE:-pulsecheck-app:latest}
  build:
    context: .
    target: app

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-PulseCheck}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see README)}
  APP_URL: ${APP_URL:?Set APP_URL in .env, e.g. https://status.example.com}
  FRONTEND_URL: ${APP_URL}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-pulsecheck}
  DB_USERNAME: ${DB_USERNAME:-pulsecheck}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PulseCheck}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: pulsecheck
  REVERB_APP_KEY: ${REVERB_APP_KEY:-pulsecheck}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  PULSECHECK_SETUP_TOKEN: ${PULSECHECK_SETUP_TOKEN:-}
  PULSECHECK_GENERATE_SETUP_TOKEN: ${PULSECHECK_GENERATE_SETUP_TOKEN:-true}
  PULSECHECK_HISTORY_RETENTION_DAYS: ${PULSECHECK_HISTORY_RETENTION_DAYS:-30}
  PULSECHECK_UPTIME_ROLLUP_RETENTION_DAYS: ${PULSECHECK_UPTIME_ROLLUP_RETENTION_DAYS:-400}
  PULSECHECK_ALLOW_PRIVATE_TARGETS: ${PULSECHECK_ALLOW_PRIVATE_TARGETS:-false}

x-app-dependencies: &app-dependencies
  db:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  web:
    image: ${WEB_IMAGE:-pulsecheck-web:latest}
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  app:
    <<: *app-image
    environment: *app-environment
    depends_on: *app-dependencies
    restart: unless-stopped
    networks: [internal]

  queue:
    <<: *app-image
    command: ["php", "artisan", "queue:work", "--queue=notifications,default", "--tries=1", "--max-time=3600", "--sleep=1"]
    environment: *app-environment
    depends_on: *app-dependencies
    stop_grace_period: 100s
    healthcheck:
      disable: true
    deploy:
      replicas: ${QUEUE_WORKERS:-2}
    restart: unless-stopped
    networks: [internal]

  reverb:
    <<: *app-image
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *app-environment
    depends_on: *app-dependencies
    healthcheck:
      disable: true
    restart: unless-stopped
    networks: [internal]

  scheduler:
    <<: *app-image
    command: ["php", "artisan", "schedule:work"]
    environment: *app-environment
    depends_on: *app-dependencies
    healthcheck:
      test: ["CMD-SHELL", "find storage/framework/scheduler-heartbeat -mmin -3 | grep -q ."]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    networks: [internal]

  migrate:
    <<: *app-image
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks: [internal]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pulsecheck}
      POSTGRES_USER: ${DB_USERNAME:-pulsecheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    profiles: [redis]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'if [ -z "$$REDIS_PASSWORD" ]; then echo "Set REDIS_PASSWORD in .env to use the redis profile." >&2; exit 1; fi; exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
